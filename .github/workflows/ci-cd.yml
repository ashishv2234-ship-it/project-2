name: NER-LogiSense CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:

  # ============================================================
  # JOB 1: BACKEND TESTING + LINTING
  # ============================================================
  test-and-lint:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest

    services:

      # ----------------------------------------------------------
      # PostgreSQL + PostGIS
      # ----------------------------------------------------------
      postgres:
        image: postgis/postgis:16-3.4

        env:
          POSTGRES_USER: ner_user
          POSTGRES_PASSWORD: ner_secure_password_2026
          POSTGRES_DB: ner_logisense_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # ----------------------------------------------------------
      # Redis
      # ----------------------------------------------------------
      redis:
        image: redis:7.2-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================================
      # PYTHON
      # ==========================================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      # ==========================================================
      # INSTALL DEPENDENCIES
      # ==========================================================
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

          python -m pip install -r backend/requirements.txt

          python -m pip install email-validator

          python -m pip install ruff mypy


      # ==========================================================
      # VERIFY EMAIL VALIDATOR
      # ==========================================================
      - name: Verify Email Validator
        run: |
          python -m pip show email-validator

          python -c "import email_validator; print('email-validator installed successfully')"


      # ==========================================================
      # VERIFY BACKEND IMPORT
      # ==========================================================
      - name: Verify Backend Import
        env:
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-12345
          DATABASE_URL: sqlite:///./test_ci.db

        run: |
          cd backend

          python -c "from app.main import app; print('Backend app import successful')"


      # ==========================================================
      # INITIALIZE TEST DATABASE
      #
      # IMPORTANT:
      # The CI runner starts with a completely fresh SQLite DB.
      # Therefore the application tables must be created before
      # pytest is executed.
      # ==========================================================
      - name: Initialize Test Database
        env:
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-12345
          DATABASE_URL: sqlite:///./test_ci.db

        run: |
          cd backend

          python -c "from app.seed.seed_data import seed_database; seed_database(); print('Test database initialized successfully')"


      # ==========================================================
      # VERIFY TEST DATABASE
      # ==========================================================
      - name: Verify Test Database
        env:
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-12345
          DATABASE_URL: sqlite:///./test_ci.db

        run: |
          cd backend

          python -c "from app.core.database import engine; from sqlalchemy import inspect; tables = inspect(engine).get_table_names(); print('Database tables:', tables); required = ['users', 'roads', 'road_segments', 'route_requests', 'field_reports']; missing = [table for table in required if table not in tables]; assert not missing, f'Missing tables: {missing}'; print('All required test tables exist')"


      # ==========================================================
      # RUFF LINT
      # ==========================================================
      - name: Run Code Linter (Ruff)
        run: |
          ruff check backend/app


      # ==========================================================
      # RUFF FORMAT
      # ==========================================================
      - name: Check Code Formatting
        run: |
          ruff format --check backend/app


      # ==========================================================
      # PYTEST
      # ==========================================================
      - name: Run Test Suite with Pytest
        env:
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-12345
          DATABASE_URL: sqlite:///./test_ci.db

        run: |
          cd backend

          python -m pytest tests/ -v --junitxml=test-results.xml


      # ==========================================================
      # UPLOAD TEST RESULTS
      # ==========================================================
      - name: Upload Test Results
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: pytest-results
          path: backend/test-results.xml
          if-no-files-found: ignore


  # ============================================================
  # JOB 2: BUILD AND PUSH DOCKER IMAGE
  # ============================================================
  build-and-push:
    name: Build & Publish OCI Container

    needs:
      - test-and-lint

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write


    steps:

      # ----------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # DOCKER BUILDX
      # ----------------------------------------------------------
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ----------------------------------------------------------
      # LOGIN TO GHCR
      # ----------------------------------------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3

        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ----------------------------------------------------------
      # BUILD + PUSH IMAGE
      # ----------------------------------------------------------
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5

        with:
          context: .
          file: ./Dockerfile

          push: true

          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ============================================================
  # JOB 3: KUBERNETES DEPLOYMENT
  # ============================================================
  deploy-to-k8s:
    name: Canary Deploy to Kubernetes

    needs:
      - build-and-push

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest


    steps:

      # ----------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------
      - name: Checkout Manifests
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # KUBECTL
      # ----------------------------------------------------------
      - name: Configure Kubectl
        uses: azure/setup-kubectl@v3


      # ----------------------------------------------------------
      # DEPLOYMENT SIMULATION
      # ----------------------------------------------------------
      - name: Deploy to Tactical Staging Cluster
        run: |
          echo "=========================================="
          echo "NER-LogiSense Kubernetes Deployment"
          echo "=========================================="

          echo "Simulating rollout to Kubernetes cluster..."

          echo "Docker image:"
          echo "ghcr.io/${{ github.repository }}/backend:${{ github.sha }}"

          echo "Kubernetes deployment simulation completed."

          # ------------------------------------------------------
          # REAL KUBERNETES COMMANDS
          # Enable these when a real cluster is configured.
          # ------------------------------------------------------

          # kubectl apply -f docs/k8s/k8s-deployment.yaml

          # kubectl rollout status \
          #   deployment/backend-api \
          #   -n ner-logisense


  # ============================================================
  # JOB 4: FRONTEND DEPLOYMENT
  # ============================================================
  deploy-frontend:
    name: Deploy Frontend to GitHub Pages

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}


    steps:

      # ----------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # CONFIGURE GITHUB PAGES
      # ----------------------------------------------------------
      - name: Setup Pages
        uses: actions/configure-pages@v5


      # ----------------------------------------------------------
      # UPLOAD FRONTEND
      # ----------------------------------------------------------
      - name: Upload Frontend
        uses: actions/upload-pages-artifact@v3

        with:
          path: "./frontend"


      # ----------------------------------------------------------
      # DEPLOY FRONTEND
      # ----------------------------------------------------------
      - name: Deploy to GitHub Pages
        id: deployment

        uses: actions/deploy-pages@v4